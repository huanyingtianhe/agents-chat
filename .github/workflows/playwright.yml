name: Playwright E2E

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Run Playwright tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 1/4
            project: desktop-chromium
            browser: chromium
            shard: 1/4
            artifact: desktop-1
          - name: 2/4
            project: desktop-chromium
            browser: chromium
            shard: 2/4
            artifact: desktop-2
          - name: 3/4
            project: desktop-chromium
            browser: chromium
            shard: 3/4
            artifact: desktop-3
          - name: 4/4
            project: desktop-chromium
            browser: chromium
            shard: 4/4
            artifact: desktop-4
          - name: Android Chromium
            project: android-chromium
            browser: chromium
            shard: 1/1
            artifact: android-chromium
          - name: iPhone WebKit
            project: iphone-webkit
            browser: webkit
            shard: 1/1
            artifact: iphone-webkit

    env:
      ADMIN_PASSWORD: admin123
      ADMIN_USERNAME: admin
      NEXTAUTH_SECRET: playwright-ci-secret
      NEXTAUTH_URL: http://localhost:3010
      PLAYWRIGHT_BASE_URL: http://localhost:3010

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build application
        run: npm run build

      - name: Start Next.js production server
        shell: bash
        run: |
          npm start >playwright-server.log 2>playwright-server.err.log &
          echo "$!" > playwright-server.pid

      - name: Wait for app
        shell: bash
        run: |
          server_pid="$(cat playwright-server.pid)"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 5 "$PLAYWRIGHT_BASE_URL/login" >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Next.js production server exited before becoming ready.' >&2
              cat playwright-server.log playwright-server.err.log 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done
          echo "Timed out waiting for $PLAYWRIGHT_BASE_URL/login" >&2
          cat playwright-server.log playwright-server.err.log 2>/dev/null || true
          exit 1

      - name: Run Playwright tests
        run: >-
          npx playwright test --config tests/playwright.config.ts
          --project=${{ matrix.project }} --shard=${{ matrix.shard }}
          --trace=retain-on-failure --reporter=line,html

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.artifact }}
          path: |
            playwright-report/
            test-results/
            playwright-server.log
            playwright-server.err.log
          if-no-files-found: ignore
